<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ganti Password — Video Panel</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--text:#e8e8ea;--muted:#9aa0aa;--line:#2a2e38;--primary:#e50914}
  @media (prefers-color-scheme:light){:root{--bg:#f3f4f6;--card:#fff;--text:#1d2327;--muted:#646970;--line:#dcdcde}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding:32px 16px}
  .card{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
  h1{font-size:19px;margin:0 0 6px}p{color:var(--muted);margin:0 0 16px}
  label{display:block;font-weight:600;margin:10px 0 4px}
  input,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
  textarea{font-family:Consolas,monospace;font-size:12px;margin-top:12px}
  button{margin-top:14px;background:var(--primary);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:600 14px inherit;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <h1>Buat kode login baru</h1>
  <p>Isi username dan password baru. Hasilnya ditempel ke bagian <code>AUTH</code> di panel.html. Password tidak dikirim ke mana pun.</p>
  <label for="u">Username</label><input id="u" autocomplete="off">
  <label for="p">Password baru</label><input id="p" type="password" autocomplete="new-password">
  <button id="go">Buat kode</button>
  <textarea id="out" rows="7" readonly placeholder="Hasil muncul di sini"></textarea>
</div>
<script>
document.getElementById('go').onclick = async function () {
  var u = document.getElementById('u').value.trim().toLowerCase(), p = document.getElementById('p').value, out = document.getElementById('out');
  if (!u || p.length < 8) { out.value = 'Username wajib diisi dan password minimal 8 karakter.'; return; }
  if (!window.crypto || !crypto.subtle) { out.value = 'Buka halaman ini lewat https (GitHub Pages).'; return; }
  var hex = function (b) { return Array.from(new Uint8Array(b), function (x) { return x.toString(16).padStart(2, '0'); }).join(''); };
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var key = await crypto.subtle.importKey('raw', new TextEncoder().encode(u + '\n' + p), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: 310000, hash: 'SHA-256' }, key, 256);
  out.value = "  var AUTH = {\n    user: '" + u.replace(/'/g, '') + "',\n    salt: '" + hex(salt) + "',\n    hash: '" + hex(bits) + "',\n    iterations: 310000\n  };";
  document.getElementById('p').value = '';
};
</script>
</body>
</html>
